    <!-- =====================================================
         FORCE NEW PAGE LOADS TO START AT THE TOP
         ===================================================== -->
    <script>
        (function () {
            if ("scrollRestoration" in history) {
                history.scrollRestoration = "manual";
            }
            function resetPagePosition() {
                if (!window.location.hash) {
                    window.scrollTo(0, 0);
                }
            }
            resetPagePosition();
            window.addEventListener(
                "load",
                function () {
                    resetPagePosition();
                    requestAnimationFrame(
                        resetPagePosition
                    );
                },
                {
                    once: true
                }
            );
            window.addEventListener(
                "pageshow",
                function () {
                    resetPagePosition();
                }
            );
        }());
    </script>
