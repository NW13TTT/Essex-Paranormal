<svg width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Dark atmospheric background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020303"/>
      <stop offset="55%" stop-color="#070a09"/>
      <stop offset="100%" stop-color="#010202"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#e9eee8" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#cbd2cc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cbd2cc" stop-opacity="0"/>
    </radialGradient>

    <!-- Green atmospheric light -->
    <radialGradient id="greenGlow">
      <stop offset="0%" stop-color="#c0ff4f" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#c0ff4f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c0ff4f" stop-opacity="0"/>
    </radialGradient>

    <!-- Fog -->
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9d0cb" stop-opacity="0"/>
      <stop offset="35%" stop-color="#c9d0cb" stop-opacity="0.10"/>
      <stop offset="65%" stop-color="#c9d0cb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9d0cb" stop-opacity="0"/>
    </linearGradient>

    <!-- Building gradient -->
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101414"/>
      <stop offset="100%" stop-color="#020303"/>
    </linearGradient>

    <!-- Subtle green grid -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80"
            fill="none"
            stroke="#c0ff4f"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Soft blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

  </defs>

  <!-- =====================================================
       SKY
       ===================================================== -->

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="1510" cy="235" r="190" fill="url(#moonGlow)"/>
  <circle cx="1510" cy="235" r="58"
          fill="#dfe5df"
          fill-opacity="0.72"/>

  <!-- Moon surface -->
  <circle cx="1492" cy="216" r="9"
          fill="#aeb6af"
          fill-opacity="0.20"/>
  <circle cx="1527" cy="250" r="13"
          fill="#aeb6af"
          fill-opacity="0.16"/>
  <circle cx="1538" cy="211" r="7"
          fill="#aeb6af"
          fill-opacity="0.16"/>

  <!-- Green atmospheric glow -->
  <ellipse cx="410" cy="620"
           rx="470"
           ry="390"
           fill="url(#greenGlow)"/>

  <!-- =====================================================
       DISTANT TREES
       ===================================================== -->

  <g fill="#030505">

    <path d="
      M0 630
      L70 570
      L105 620
      L150 550
      L195 625
      L245 565
      L290 625
      L350 545
      L405 625
      L455 565
      L510 630
      L565 550
      L620 630
      L680 565
      L735 630
      L790 555
      L850 630
      L920 560
      L980 630
      L1040 570
      L1100 630
      L1160 550
      L1220 630
      L1280 565
      L1340 630
      L1400 555
      L1460 630
      L1520 565
      L1580 630
      L1640 550
      L1700 630
      L1760 570
      L1820 630
      L1880 555
      L1920 630
      L1920 1080
      L0 1080 Z"/>

  </g>

  <!-- =====================================================
       HAUNTED BUILDING
       ===================================================== -->

  <g>

    <!-- Main building -->
    <path d="
      M610 470
      L610 850
      L1390 850
      L1390 470
      L1280 470
      L1280 410
      L1210 410
      L1210 470
      L790 470
      L790 410
      L710 410
      L710 470
      Z"
      fill="url(#building)"
      stroke="#171d1a"
      stroke-width="3"/>

    <!-- Roof -->
    <path d="
      M550 470
      L1000 250
      L1450 470
      Z"
      fill="#040606"
      stroke="#161b18"
      stroke-width="4"/>

    <!-- Roof ridge -->
    <path d="
      M1000 250
      L1000 180"
      stroke="#111614"
      stroke-width="7"/>

    <!-- Chimneys -->
    <rect x="690" y="335" width="75" height="155" fill="#050707"/>
    <rect x="1240" y="335" width="75" height="155" fill="#050707"/>

    <!-- Chimney caps -->
    <rect x="675" y="325" width="105" height="16" fill="#090c0b"/>
    <rect x="1225" y="325" width="105" height="16" fill="#090c0b"/>

    <!-- Upper windows -->
    <g fill="#030505" stroke="#202823" stroke-width="4">

      <rect x="805" y="400" width="90" height="115"/>
      <rect x="955" y="365" width="90" height="150"/>
      <rect x="1105" y="400" width="90" height="115"/>

    </g>

    <!-- Upper window glow -->
    <g fill="#c0ff4f" fill-opacity="0.025">
      <rect x="817" y="412" width="66" height="91"/>
      <rect x="967" y="377" width="66" height="126"/>
      <rect x="1117" y="412" width="66" height="91"/>
    </g>

    <!-- Main windows -->
    <g fill="#020303" stroke="#1d2520" stroke-width="5">

      <rect x="680" y="550" width="125" height="180"/>
      <rect x="850" y="550" width="125" height="180"/>
      <rect x="1045" y="550" width="125" height="180"/>
      <rect x="1215" y="550" width="125" height="180"/>

    </g>

    <!-- Window crosses -->
    <g stroke="#1b211e" stroke-width="5">

      <path d="M742 550V730"/>
      <path d="M680 640H805"/>

      <path d="M912 550V730"/>
      <path d="M850 640H975"/>

      <path d="M1107 550V730"/>
      <path d="M1045 640H1170"/>

      <path d="M1277 550V730"/>
      <path d="M1215 640H1340"/>

    </g>

    <!-- Entrance -->
    <rect x="955" y="600" width="90" height="250"
          fill="#010202"
          stroke="#1e2621"
          stroke-width="5"/>

    <!-- Door detail -->
    <circle cx="1025" cy="725" r="5"
            fill="#c0ff4f"
            fill-opacity="0.4"/>

  </g>

  <!-- =====================================================
       FOREGROUND GROUND
       ===================================================== -->

  <path d="
    M0 790
    C250 730 430 815 650 770
    C900 720 1110 820 1330 765
    C1550 710 1740 800 1920 750
    L1920 1080
    L0 1080 Z"
    fill="#020303"/>

  <!-- Ground green reflection -->
  <ellipse cx="1010" cy="835"
           rx="500"
           ry="70"
           fill="#c0ff4f"
           fill-opacity="0.035"
           filter="url(#blur)"/>

  <!-- =====================================================
       INVESTIGATION EQUIPMENT SILHOUETTES
       ===================================================== -->

  <g fill="#030505"
     stroke="#182019"
     stroke-width="3">

    <!-- Tripod -->
    <path d="
      M390 700
      L450 700
      L475 890
      L455 890
      L420 735
      L385 890
      L365 890
      Z"/>

    <rect x="375" y="660" width="90" height="55" rx="5"/>

    <!-- Camera -->
    <rect x="390" y="645" width="60" height="40" rx="5"/>
    <circle cx="420" cy="665" r="14"
            fill="#020303"/>

    <!-- EMF meter -->
    <rect x="1490" y="670" width="70" height="110" rx="8"/>
    <rect x="1502" y="685" width="46" height="35"
          fill="#c0ff4f"
          fill-opacity="0.035"/>

    <!-- Small sensor -->
    <rect x="1600" y="735" width="70" height="45" rx="5"/>
    <circle cx="1635" cy="757" r="10"
            fill="#c0ff4f"
            fill-opacity="0.08"/>

  </g>

  <!-- =====================================================
       FOG
       ===================================================== -->

  <g opacity="0.45">

    <path d="
      M-100 790
      C300 710 520 830 850 760
      C1150 695 1460 810 2020 720
      L2020 820
      C1600 900 1250 790 900 850
      C520 915 250 800 -100 900 Z"
      fill="url(#fog)"
      filter="url(#blur)"/>

    <path d="
      M-100 900
      C300 820 600 950 950 875
      C1300 800 1580 930 2020 840
      L2020 940
      C1600 1010 1250 900 900 975
      C550 1040 250 920 -100 1010 Z"
      fill="url(#fog)"
      filter="url(#blur)"/>

  </g>

  <!-- =====================================================
       TECHNICAL GRID
       ===================================================== -->

  <rect width="1920" height="1080"
        fill="url(#grid)"/>

  <!-- Fade grid toward right -->
  <rect x="950" width="970" height="1080"
        fill="#020303"
        fill-opacity="0.18"/>

  <!-- =====================================================
       GREEN INVESTIGATION MARKERS
       ===================================================== -->

  <g stroke="#c0ff4f"
     stroke-opacity="0.35"
     fill="none">

    <!-- Left marker -->
    <path d="M90 760V710H140"/>
    <path d="M90 760H140"/>

    <!-- Right marker -->
    <path d="M1780 710H1830V760"/>
    <path d="M1780 760H1830"/>

  </g>

  <!-- Tiny technical points -->
  <g fill="#c0ff4f" fill-opacity="0.45">
    <circle cx="145" cy="720" r="3"/>
    <circle cx="1760" cy="735" r="3"/>
    <circle cx="540" cy="600" r="2"/>
    <circle cx="1375" cy="580" r="2"/>
  </g>

  <!-- =====================================================
       FINAL DARK VIGNETTE
       ===================================================== -->

  <rect width="1920" height="1080"
        fill="none"
        stroke="#000"
        stroke-opacity="0.55"
        stroke-width="90"/>

</svg>
